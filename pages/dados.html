<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolar Dados - Aventura Digital</title>
    <link rel="stylesheet" href="../stylesheets/dados.css">
    <link rel="stylesheet" href="../stylesheets/components.css">
    <script type="module" src="../scripts/dados.js"></script>
    <script type="module" src="../scripts/components/loader.js"></script>
</head>
<body>

    <div data-component="comp-header"></div>


    <!-- CONTAINER DA DASHBOARD -->
    <div class="dashboard-container">
        <main class="main-content">
            
            <!-- PAINEL DE CONFIGURAÇÃO (BASEADO NO TOPO DA SUA IMAGEM) -->
            <section class="dice-config-panel">
                <div class="config-group">
                    <label for="dice-count">Número de dados</label>
                    <select id="dice-count">
                        <option value="1" selected>1 dado</option>
                        <option value="2">2 dados</option>
                        <option value="3">3 dados</option>
                        <option value="4">4 dados</option>
                        <option value="5">5 dados</option>
                        <option value="6">6 dados</option>
                    </select>
                </div>

                <div class="config-group">
                    <label for="dice-sides">Número de lados</label>
                    <select id="dice-sides">
                        <option value="4">d4</option>
                        <option value="6">d6</option>
                        <option value="8">d8</option>
                        <option value="10">d10</option>
                        <option value="12">d12</option>
                        <option value="20">d20</option>
                    </select>
                </div>
            </section>

            <!-- ÁREA DE EXIBIÇÃO DOS DADOS (GRID MOCKUP) -->
            <section class="dice-display-area">
                <div class="dice-grid">

                </div>
            </section>

            <!-- SEÇÃO DE AÇÃO E RESULTADOS -->
            <section class="dice-action-area">
                <button type="button" class="btn-roll" id="lauch">Lançar</button>
                <div class="total-display">
                    Total : <span class="total-value" id="total">0</span>
                </div>
            </section>

        </main>
    </div>

    <div data-component="comp-footer"></div>
</body>
</html>
