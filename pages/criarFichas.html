<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/criarFichas.css">
    <link rel="stylesheet" href="../stylesheets/components.css">
    <title>Creator</title>
</head>
<body>

    <header class="site-header">
        <div class="logo">
            <span class="logo-img"> <img src="../Img_folder/d20-certo-sem-fundo.png" alt="imagem de d20"></span>
            <span class="logo-texto">Criador de Ficha RPG</span>
        </div>
        <div class="cta-buttons">
            <a href="../index.html" class="btn">Página Principal</a>
            <a href="criarFichas.html" class="btn btn-primary">Criar Ficha</a>
            <a href="minhasFichas.html" class="btn btn-secondary">Minhas Fichas</a>
            <a href="bibliotecaFichas.html" class="btn btn-secondary">Biblioteca Fichas</a>
            <a href="dados.html" class="btn btn-terciary">Rolar Dados</a>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="main-content">
            <h1>Insert your Character Info</h1>
            
            <form action="#" id="formBox">
                
                <!-- SEÇÃO: CREATE CHARACTER -->
                <section class="CharacterInfoBox">
                    <h2>Create Character</h2>
                    <div id="formCharacterInfoBox">
                        <div class="characterInfoInput">
                            <label for="name">Name:</label>
                            <input name="name" id="name" type="text" placeholder="Nome do personagem">
                        </div>
                        <div class="characterInfoInput">
                            <label for="sex">Sex:</label>
                            <input name="sex" id="sex" type="text" placeholder="Ex: Masculino, Feminino">
                        </div>
                        <div class="characterInfoInput">
                            <label for="class">Class:</label>
                            <input name="class" id="class" type="text" placeholder="Ex: Guerreiro, Mago">
                        </div>
                        <div class="characterInfoInput">
                            <label for="gift">Gift:</label>
                            <input name="gift" id="gift" type="text" placeholder="Item inicial ou dádiva">
                        </div>
                        <div class="characterInfoInput row-full">
                            <label for="health">Health:</label>
                            <input name="health" id="health" type="number" placeholder="Pontos de vida máximos">
                        </div>
                    </div>
                </section>

                <!-- SEÇÃO: CHARACTER STATUS -->
                <section class="CharacterInfoBox">
                    <h2>Character Status</h2>
                    <div id="formCharacterStatusBox">
                        
                        <!-- Linha do Level (Cabeçalho da tabela) -->
                        <div class="statusRow headerRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon"></span>
                                <label for="level">LEVEL</label>
                            </div>
                            <input name="level" id="level" type="number" value="1">
                            <span class="columnLabel">MOD</span>
                            <span class="columnLabel">MOD+LEVEL</span>
                        </div>

                        <!-- Atributos principais -->
                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="vitality">VITALITY</label>
                            </div>
                            <input name="vitality" id="vitality" type="number" placeholder="0">
                            <input name="vitalityMod" type="number" placeholder="0">
                            <input name="vitalityModLevel" type="number" placeholder="0">
                        </div>

                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="strength">STRENGTH</label>
                            </div>
                            <input name="strength" id="strength" type="number" placeholder="0">
                            <input name="strengthMod" type="number" placeholder="0">
                            <input name="strengthModLevel" type="number" placeholder="0">
                        </div>

                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="dexterity">DEXTERITY</label>
                            </div>
                            <input name="dexterity" id="dexterity" type="number" placeholder="0">
                            <input name="dexterityMod" type="number" placeholder="0">
                            <input name="dexterityModLevel" type="number" placeholder="0">
                        </div>

                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="resistence">RESISTENCE</label>
                            </div>
                            <input name="resistence" id="resistence" type="number" placeholder="0">
                            <input name="resistenceMod" type="number" placeholder="0">
                            <input name="resistenceModLevel" type="number" placeholder="0">
                        </div>

                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="intelligence">INTELLIGENCE</label>
                            </div>
                            <input name="intelligence" id="intelligence" type="number" placeholder="0">
                            <input name="intelligenceMod" type="number" placeholder="0">
                            <input name="intelligenceModLevel" type="number" placeholder="0">
                        </div>

                        <div class="statusRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon attribute-icon"></span>
                                <label for="faith">FAITH</label>
                            </div>
                            <input name="faith" id="faith" type="number" placeholder="0">
                            <input name="faithMod" type="number" placeholder="0">
                            <input name="faithModLevel" type="number" placeholder="0">
                        </div>

                        <!-- Linha da Humanity (Rodapé da tabela) -->
                        <div class="statusRow footerRow">
                            <div class="statusLabel">
                                <span class="placeholder-icon humanity-icon"></span>
                                <label for="humanity">HUMANITY</label>
                            </div>
                            <input name="humanity" id="humanity" type="number" placeholder="0">
                        </div>

                    </div>
                </section>

                <!-- SEÇÃO INFERIOR: SLOTS E TEXTOS (Lado a Lado) -->
                <div id="bottomSection">
                    
                    <!-- Blocos de Inventário/Equipamento (4 quadrados à esquerda) -->
                    <div id="equipmentSlotsGrid">
                        <div class="slot" title="Slot de Equipamento"></div>
                        <div class="slot" title="Slot de Equipamento"></div>
                        <div class="slot" title="Slot de Equipamento"></div>
                        <div class="slot" title="Slot de Equipamento"></div>
                        <div class="slot" title="Slot de Equipamento"></div>
                        <div class="slot" title="Slot de Equipamento"></div>
                    </div>

                    <!-- Listas de Texto (Painel da direita) -->
                    <div id="extraInfoBox">
                        <div class="textareaGroup">
                            <label for="spells">SPELLS:</label>
                            <textarea name="spells" id="spells" rows="3" placeholder="Escreva as magias ou milagres aprendidos..."></textarea>
                        </div>
                        
                        <div class="textareaGroup">
                            <label for="equipment">EQUIPMENT:</label>
                            <textarea name="equipment" id="equipment" rows="3" placeholder="Armas, armaduras e escudos equipados..."></textarea>
                        </div>
                        
                        <div class="textareaGroup">
                            <label for="items">ITEMS:</label>
                            <textarea name="items" id="items" rows="3" placeholder="Itens consumíveis ou utilitários na mochila..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- BOTÃO DE SALVAR FORMULÁRIO -->
                <div class="form-actions">
                    <button type="submit" class="btn-save">Salvar Personagem</button>
                </div>

            </form>
        </div>
    </main>

    <footer class="rodape">
        <div class="texto">
            <p>&copy; 2026 . Todos os direitos reservados.</p>
        </div>

        <div class="links-rodape">
            <a href="#">Ajuda & Suporte</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Política de Privacidade</a>
        </div>
    </footer>

</body>

</html>
