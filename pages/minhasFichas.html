<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Fichas</title>
    <link rel="stylesheet" href="../stylesheets/minhasFichas.css">
    <link rel="stylesheet" href="../stylesheets/components.css">
    <script type="module" src="../scripts/minhasFichas.js"></script>
    <script type="module" src="../scripts/components/loader.js"></script>
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <div data-component="comp-header"></div>

    <!-- CONTAINER DA DASHBOARD -->
    <div class="dashboard-container">
        <main class="main-content">
            
            <header class="panel-header">
                <div>
                    <h1>Minhas Fichas</h1>
                    <small>MINHAS FICHAS (0)</small>
                </div>
            </header>

            <section class="filters-section">
                <form class="filters-form" onsubmit="return false;">
                    <input id="pesquisar" type="search" placeholder="Pesquisar">
                    <input id="classe" type="text" placeholder="Classe">
                    <input id="nivel" type="number" placeholder="Nivel" min="0">
                </form>
            </section>

            <section class="characters-section">
                <div class="cards-grid">
                </div>
            </section>
        </main>
    </div>

    <div id="popupDeletarFicha" class="closed">
        <button type="button" class="close-btn" onclick="fecharPopupDeletar()">&times;</button>
        <p>Tem certeza que deseja deletar permanentemente este personagem?</p>
        <div class="popup-acoes">
            <button type="button" id="btnConfirmarDeletar" class="btn-popup-perigo">Sim, Deletar</button>
            <button type="button" class="btn-popup-neutral" onclick="fecharPopupDeletar()">Cancelar</button>
        </div>
    </div>

    <!-- RODAPÉ GLOBAL DA PÁGINA -->
    <div data-component="comp-footer"></div>
</body>
</html>
