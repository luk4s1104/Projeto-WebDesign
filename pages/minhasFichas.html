<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Fichas</title>
    <link rel="stylesheet" href="../stylesheets/minhasFichas.css">
    <link rel="stylesheet" href="../stylesheets/components.css">
    <script type="module" src="../scripts/minhasFichas.js"></script>
    <script type="module" src="../scripts/loader.js"></script>
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <div data-component="comp-header"></div>

    <!-- CONTAINER DA DASHBOARD -->
    <div class="dashboard-container">
        <main class="main-content">
            
            <header class="panel-header">
                <div>
                    <h1>Minhas Fichas</h1>
                    <small>MINHAS FICHAS (1)</small>
                </div>
            </header>

            <section class="filters-section">
                <form class="filters-form" onsubmit="return false;">
                    <input type="search" placeholder="Search">
                    <select name="classe"><option>Classe</option></select>
                    <select name="race"><option>Race</option></select>
                    <select name="nivel"><option>Nivel</option></select>
                </form>
            </section>

            <section class="characters-section">
                <div class="cards-grid">
                    <!-- PERSONAGEM 1 -->
                    <article class="char-card">
                        <header class="char-card-header">
                            <div>
                                <h4>Thorgar</h4>
                                <div class="char-subtitle">Por: @LucasRicci</div>
                            </div>
                            <span class="char-level">Nvl 8</span>
                        </header>

                        <figure class="char-avatar">
                            <img src="../Img_folder/combatente.jpg" alt="imagem generica de personagem de rpg">
                            <figcaption>Combatente Corporal</figcaption>
                        </figure>

                        <div class="char-hp">
                            <span class="hp-label">VIDA: 70</span>
                        </div>

                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th>VIT</th><th>FOR</th><th>DES</th><th>RES</th><th>INT</th><th>FÉ</th><th>HUM</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>18</td><td>20</td><td>10</td><td>19</td><td>8</td><td>12</td><td>15</td>
                                </tr>
                            </tbody>
                        </table>

                        <ul class="equip-list">
                            <li>Martelo de Guerra</li>
                            <li>Escudo Pesado</li>
                        </ul>
                        <footer class="char-card-footer">
                            <ul class="action-buttons">
                                <li><button type="button">Visualizar</button></li>
                                <li><button type="button">Editar</button></li>
                                <li><button type="button">Deletar</button></li>
                                <li><button type="button">Compartilhar</button></li>
                            </ul>
                        </footer>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <!-- RODAPÉ GLOBAL DA PÁGINA -->
    <div data-component="comp-footer"></div>
</body>
</html>
